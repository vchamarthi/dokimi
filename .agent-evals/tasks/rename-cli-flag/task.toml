version = "1.0"

[metadata]
family = "docs"
base = "16e319fdcb2f4eb6e0dfa44b7c05a2d451599586"
created = "2026-10-15"
source = "https://github.com/intel/dokimi/pull/57"

[agent]
timeout_sec = 1200

[grader]
type = "dokimi_code"
targets = ["tests/test_hidden_repeats_flag.py"]
regression_targets = ["tests"]
