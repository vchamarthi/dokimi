# CI speed study, experiment branch only. Manual, fork only. Not the project's CI:
# the real workflow is on main. Each job is one VM running dokimi/scripts/ci_speed_study.py,
# which builds every condition from a git archive of the base commit and writes
# summary.json plus bounded logs and results.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

# One study at a time per ref (a second dispatch queues; it never cancels a run in flight),
# so two studies do not share the runner pool and skew each other's timings.
concurrency:
  group: ci-speed-study-${{ github.ref }}
  cancel-in-progress: false

jobs:
  study:
    name: ${{ matrix.family }} repeat ${{ matrix.repeat }}
    if: ${{ github.repository == 'vchamarthi/dokimi' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {family: windows, os: windows-latest, python: '3.13', repeat: 1}
          - {family: windows, os: windows-latest, python: '3.13', repeat: 2}
          - {family: windows, os: windows-latest, python: '3.13', repeat: 3}
          - {family: windows, os: windows-latest, python: '3.13', repeat: 4}
          - {family: windows, os: windows-latest, python: '3.13', repeat: 5}
          - {family: linux, os: ubuntu-latest, python: '3.14', repeat: 1}
          - {family: linux, os: ubuntu-latest, python: '3.14', repeat: 2}
          - {family: linux, os: ubuntu-latest, python: '3.14', repeat: 3}
          - {family: linux, os: ubuntu-latest, python: '3.14', repeat: 4}
          - {family: linux, os: ubuntu-latest, python: '3.14', repeat: 5}
    steps:
      # Full history: the study script archives the base commit and checks that this
      # branch differs from it in the workflow and the script only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run the study
        shell: bash
        timeout-minutes: 52
        env:
          FAMILY: ${{ matrix.family }}
          REPEAT: ${{ matrix.repeat }}
          PYTHON: ${{ matrix.python }}
          WORK: ${{ runner.temp }}
        run: |
          python dokimi/scripts/ci_speed_study.py --family "$FAMILY" --repeat "$REPEAT" \
            --python "$PYTHON" --repo "$GITHUB_WORKSPACE" \
            --out "$WORK/study-out" --lab "$WORK/study-lab"
      - name: Upload study evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: study-${{ matrix.family }}-${{ matrix.repeat }}
          path: ${{ runner.temp }}/study-out
          retention-days: 14
          if-no-files-found: warn
