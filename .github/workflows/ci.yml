# Benchmark branch only (vchamarthi/dokimi, test/ci-windows-installer-benchmark-20261023).
# Hosted CI-step experiment in clean virtualenvs: pip vs uv pip, wheel install and
# hash-locked test install. Not a reproduction of the global-Python windows-smoke
# job, and not a queue or end-to-end CI speedup measurement.

name: Dokimi Windows installer experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pair:
    name: Installer pair ${{ matrix.pair }}
    if: ${{ github.repository == 'vchamarthi/dokimi' && github.ref == 'refs/heads/test/ci-windows-installer-benchmark-20261023' }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pair: [1, 2, 3, 4, 5]
    steps:
      # Full history: later fix commits sit on top of the pinned product source,
      # which the script proves is an ancestor of HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Run the installer experiment
        env:
          PAIR: ${{ matrix.pair }}
          OUT_DIR: ${{ runner.temp }}\installer-out
          LAB_DIR: ${{ runner.temp }}\installer-lab
        run: python dokimi/scripts/ci_installer_experiment.py --pair "$env:PAIR" --repo . --out "$env:OUT_DIR" --lab "$env:LAB_DIR"
      - name: Upload results, logs and JUnit
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: installer-pair-${{ matrix.pair }}
          path: ${{ runner.temp }}\installer-out
          retention-days: 7
          if-no-files-found: warn
