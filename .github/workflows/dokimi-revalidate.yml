name: dokimi-revalidate
'on':
  workflow_call:
    inputs:
      dokimi-ref:
        description: Pinned trusted engine commit or release tag
        required: true
        type: string
      dokimi-repository:
        description: Engine/action repository
        required: false
        type: string
        default: intel/dokimi
      config:
        description: Relative configuration path read from approved base
        required: false
        type: string
        default: ''
      policy:
        description: Relative trusted policy path read from approved base
        required: false
        type: string
        default: ''
      environment:
        description: Required protected environment for paid run
        required: false
        type: string
        default: ''
      max-usd:
        description: Explicit paid budget
        required: false
        type: string
        default: '0'
      model:
        description: Measured model
        required: false
        type: string
        default: ''
      provider:
        description: Provider
        required: false
        type: string
        default: ''
      judge-model:
        description: Independent judge
        required: false
        type: string
        default: ''
      judge-provider:
        description: Judge provider
        required: false
        type: string
        default: ''
      reps:
        description: Repetitions
        required: false
        type: number
        default: 3
      subject:
        description: Declared subject ID
        required: false
        type: string
        default: ''
      harness:
        description: Harness
        required: false
        type: string
        default: arms-runner
      revision:
        description: Approved content commit
        required: true
        type: string
      baseline:
        description: Baseline JSON path on baseline branch
        required: true
        type: string
      max-calls:
        description: Finite maximum model calls; required for Claude subscription billing
        required: false
        type: number
        default: 0
    secrets:
      openai-api-key:
        description: Optional OpenAI credential; required when that provider is selected
        required: false
      anthropic-api-key:
        description: Optional Anthropic credential
        required: false
      claude-code-oauth-token:
        description: Explicit hosted Claude subscription OAuth token; local credentials are never uploaded by this
          workflow
        required: false
permissions: {}
jobs:
  revalidate:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
    - name: Validate revalidation controller
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        REVISION: ${{ inputs.revision }}
        ENVIRONMENT: ${{ inputs.environment }}
        POLICY: ${{ inputs.policy }}
        CONFIG: ${{ inputs.config }}
        BASELINE: ${{ inputs.baseline }}
        HARNESS: ${{ inputs.harness }}
      with:
        script: |
          if (process.env.HARNESS !== 'arms-runner') throw new Error('Hosted revalidation supports only arms-runner');
          if (context.ref !== `refs/heads/${context.payload.repository.default_branch}`) throw new Error('Revalidation requires default-branch controller');
          if (!/^[0-9a-f]{40}$/.test(process.env.REVISION) || !process.env.ENVIRONMENT || !process.env.POLICY) throw new Error('Pinned revision, protected environment and policy required');
          for (const path of [process.env.POLICY,process.env.CONFIG,process.env.BASELINE]) {
            if (path && (path.startsWith('/') || path.split(/[\\/]/).includes('..'))) throw new Error('Paths must stay inside trusted roots');
          }
    - name: Resolve dokimi-ref
      id: engine
      shell: bash
      env:
        REF: ${{ inputs.dokimi-ref }}
        DOKIMI_REPO: ${{ inputs.dokimi-repository }}
      run: |
        if ! [[ "$DOKIMI_REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]]; then
          echo "::error title=dokimi-repository::dokimi-repository is not owner/name"
          exit 1
        fi
        if [[ "$REF" =~ ^[0-9A-Fa-f]{40}$ ]]; then
          sha=${REF,,}
        elif [[ "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/+-]*$ ]]; then
          # An annotated tag's commit is its peeled (^{}) line.
          sha=$(git ls-remote --tags "https://github.com/$DOKIMI_REPO" \
                | awk -v t="refs/tags/$REF" '$2 == t "^{}" { p = $1 } $2 == t { l = $1 } END { print (p != "" ? p : l) }')
        fi
        if ! [[ "${sha:-}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error title=dokimi-ref::dokimi-ref is neither a 40-digit commit SHA nor a tag of $DOKIMI_REPO"
          exit 1
        fi
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "dokimi $DOKIMI_REPO@$REF -> $sha"
    - name: Check out pinned engine actions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ inputs.dokimi-repository }}
        ref: ${{ steps.engine.outputs.sha }}
        path: .dokimi-action
        persist-credentials: false
        sparse-checkout: |-
          actions
          action.yml
        sparse-checkout-cone-mode: false
    - name: Install pinned engine
      id: setup
      uses: ./.dokimi-action/actions/setup
      with:
        dokimi-repository: ${{ inputs.dokimi-repository }}
        dokimi-ref: ${{ steps.engine.outputs.sha }}
        out-dir: ${{ runner.temp }}/dokimi-out
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ github.repository }}
        ref: ${{ inputs.revision }}
        path: candidate
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ github.repository }}
        ref: refs/heads/dokimi-baselines
        path: baselines
        persist-credentials: false
        fetch-depth: 0
    - name: Install pinned Claude subscription CLI
      if: ${{ inputs.provider == 'claude-cli' || inputs.judge-provider == 'claude-cli' }}
      shell: bash
      run: |
        npm install --global --ignore-scripts @anthropic-ai/claude-code@2.1.306
        claude --version
    - name: Revalidate without promotion
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        ROOT: ${{ github.workspace }}/candidate
        BASELINE: ${{ github.workspace }}/baselines/${{ inputs.baseline }}
        OUT: ${{ runner.temp }}/dokimi-out
        CONFIG: ${{ inputs.config }}
        POLICY: ${{ inputs.policy }}
        MODEL: ${{ inputs.model }}
        PROVIDER: ${{ inputs.provider }}
        JUDGE_MODEL: ${{ inputs.judge-model }}
        JUDGE_PROVIDER: ${{ inputs.judge-provider }}
        MAX_USD: ${{ inputs.max-usd }}
        REPS: ${{ inputs.reps }}
        SUBJECT: ${{ inputs.subject }}
        HARNESS: ${{ inputs.harness }}
        OPENAI_API_KEY: ${{ secrets.openai-api-key }}
        ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude-code-oauth-token }}
        MAX_CALLS: ${{ inputs.max-calls }}
      run: |
        args=(ci revalidate "$ROOT" --baseline "$BASELINE" --out-dir "$OUT" --model "$MODEL" --provider "$PROVIDER" --judge-model "$JUDGE_MODEL" --judge-provider "$JUDGE_PROVIDER" --reps "$REPS" --subject "$SUBJECT" --harness "$HARNESS")
        [[ -z "$MAX_USD" || "$MAX_USD" == 0 ]] || args+=(--max-usd "$MAX_USD")
        [[ -z "$MAX_CALLS" || "$MAX_CALLS" == 0 ]] || args+=(--max-calls "$MAX_CALLS")
        [[ -z "$CONFIG" ]] || args+=(--config "$ROOT/$CONFIG")
        [[ -z "$POLICY" ]] || args+=(--policy "$ROOT/$POLICY")
        dokimi "${args[@]}"
    - name: Append report
      if: ${{ always() }}
      shell: bash
      env:
        REPORT: ${{ runner.temp }}/dokimi-out/report.md
      run: |
        if [[ -f "$REPORT" ]]; then cat -- "$REPORT" >> "$GITHUB_STEP_SUMMARY"; fi
    - name: Upload run JSON only
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: dokimi-run-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/dokimi-out/run.json
        if-no-files-found: warn
        retention-days: 7
